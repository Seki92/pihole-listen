# Konfiguration für die GitHub-Action "Listen bereinigen" (.github/workflows/listen-bereinigen.yml).
# Enthält keine Passwörter – die Server-Zugangsdaten liegen nur auf deinem Server
# in /etc/listen-update.conf (angelegt von tools/einrichten.sh).
REPO_URL="https://github.com/Seki92/pihole-listen.git"
REPO_DIR="${GITHUB_WORKSPACE:-/tmp/pihole-listen}"
BRANCH="master"

BLOCK_DATEIEN=(Blockliste blocklist1 blocklist3)
ERLAUBT_DATEIEN=(whitelist)

GIT_NAME="github-actions[bot]"
GIT_MAIL="41898282+github-actions[bot]@users.noreply.github.com"

# Für die monatliche Prüfung auf tote Domains (ungefilterter Resolver)
RESOLVER="9.9.9.10"
PARALLEL=32
MAX_TOTE_PROZENT=70

LOCKDATEI="/tmp/listen-update.lock"
